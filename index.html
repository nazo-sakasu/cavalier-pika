<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>ぴかっ！</title>
  <style>
    :root{--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html,body{height:100%;background:#04070d}
    body{display:flex;flex-direction:column;min-height:100svh;overflow:hidden}
    .sel{position:fixed;inset:0;z-index:100;background:#04070d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:44px;padding:calc(var(--st)+24px) 28px calc(var(--sb)+24px);transition:opacity 380ms ease,visibility 380ms ease}
    .sel.hidden{opacity:0;visibility:hidden;pointer-events:none}
    .cards{display:flex;gap:20px;width:100%;max-width:400px;align-items:center}
    .card{flex:1;border:none;background:transparent;padding:0;cursor:pointer;filter:invert(1);transition:transform 200ms}
    .card:hover{transform:scale(1.06)}
    .card:active{transform:scale(0.96)}
    .card img{width:100%;display:block;pointer-events:none;user-select:none;-webkit-user-drag:none}
    .div{width:1px;height:120px;background:linear-gradient(to bottom,transparent,rgba(255,255,255,.18),transparent);flex-shrink:0}
    .main{flex:1;display:flex;flex-direction:column;min-height:0;opacity:0;transition:opacity 400ms ease 180ms}
    .main.visible{opacity:1}
    .photo{position:relative;flex:1;overflow:hidden;min-height:0}
    .photo img{width:100%;height:100%;object-fit:cover;object-position:center center;display:block;pointer-events:none;user-select:none;-webkit-user-drag:none}
    .photo::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 50%,rgba(4,7,13,.5) 86%,#04070d 100%);pointer-events:none}
    .back{position:absolute;top:calc(var(--st)+12px);left:14px;z-index:10;background:rgba(10,18,32,.65);border:1px solid rgba(255,255,255,.18);border-radius:50px;color:#cde9ff;font-family:"Hiragino Sans",sans-serif;font-size:.88rem;font-weight:700;padding:8px 16px;cursor:pointer;backdrop-filter:blur(10px)}
    .eye{position:absolute;border-radius:50%;pointer-events:none;mix-blend-mode:screen;opacity:0;transform:scale(.5);transition:opacity 140ms ease,transform 140ms ease;background:radial-gradient(circle,rgba(240,252,255,1) 0%,rgba(220,248,255,1) 8%,rgba(140,224,255,.97) 26%,rgba(72,178,255,.82) 50%,rgba(50,150,255,.30) 72%,rgba(30,120,255,0) 100%);filter:blur(.4px) drop-shadow(0 0 5px rgba(180,235,255,.95)) drop-shadow(0 0 16px rgba(110,205,255,.88)) drop-shadow(0 0 38px rgba(70,175,255,.60))}
    .eye::before{content:"";position:absolute;inset:18%;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,1) 0%,rgba(255,255,255,.65) 40%,rgba(255,255,255,0) 100%)}
    .eye.on{opacity:1;transform:scale(1.08);animation:ep .85s ease-in-out infinite alternate}
    @keyframes ep{
      from{filter:blur(.3px) drop-shadow(0 0 5px rgba(180,235,255,.9)) drop-shadow(0 0 15px rgba(110,205,255,.82)) drop-shadow(0 0 36px rgba(70,175,255,.55));transform:scale(1.04)}
      to{filter:blur(1px) drop-shadow(0 0 13px rgba(215,250,255,1)) drop-shadow(0 0 32px rgba(150,220,255,.98)) drop-shadow(0 0 76px rgba(70,175,255,.72));transform:scale(1.15)}
    }
    .bottom{flex-shrink:0;padding:11px 20px calc(16px + var(--sb));display:flex;flex-direction:column;align-items:center;gap:10px}
    .msg{font-family:"Hiragino Sans",sans-serif;font-size:clamp(1.1rem,5.5vw,1.5rem);font-weight:800;letter-spacing:.10em;color:#eaf7ff;text-shadow:0 0 10px rgba(130,215,255,.95),0 0 28px rgba(80,185,255,.68);min-height:1.8em;text-align:center;opacity:0;transition:opacity 220ms ease}
    .msg.visible{opacity:1}
    .btn{display:block;width:100%;max-width:340px;border:none;border-radius:20px;height:56px;font-family:"Hiragino Sans",sans-serif;font-size:1.05rem;font-weight:800;letter-spacing:.07em;cursor:pointer;color:#03101f;background:linear-gradient(170deg,#dcf4ff 0%,#8ad2ff 42%,#4ab4ff 100%);box-shadow:0 8px 26px rgba(80,195,255,.38),inset 0 1px 0 rgba(255,255,255,.6);transition:transform 120ms}
    .btn:hover{transform:translateY(-2px)}
    .btn:active{transform:translateY(1px) scale(.983)}
  </style>
</head>

      <div class="eye" id="eA"></div>
      <div class="eye" id="eB"></div>
      <button class="back" onclick="goBack()">← 戻る</button>
    </div>
    <div class="bottom">
      <div class="msg" id="msg"></div>
      <button class="btn" id="btn">ここを押す</button>
    </div>
  </div>
  <script>
    var EYE = {
      dog: {W:1024, H:1024, e:[{cx:0.2520,cy:0.3652,r:0.077},{cx:0.7441,cy:0.3691,r:0.087}]},
      person: {W:1333, H:2000, e:[{cx:0.43067,cy:0.26667,r:0.035},{cx:0.57467,cy:0.27644,r:0.035}]}
    };
    function posEyes(m) {
      var ph = document.getElementById('photo');
      var pW = ph.clientWidth, pH = ph.clientHeight;
      var d = EYE[m];
      var sc = Math.max(pW/d.W, pH/d.H);
      var rW = d.W*sc, rH = d.H*sc;
      var offX = (pW-rW)*0.5, offY = (pH-rH)*0.5;
      var ids = ['eA','eB'];
      for (var i=0; i<2; i++) {
        var e = d.e[i];
        var cx = e.cx*rW+offX, cy = e.cy*rH+offY, r = e.r*rW;
        document.getElementById(ids[i]).style.cssText = 'left:'+(cx-r)+'px;top:'+(cy-r)+'px;width:'+(r*2)+'px;height:'+(r*2)+'px';
      }
    }
    var fm = {dog:'コウです！', person:'てっぺです。'};
    var mode=null, step=0, bl=null, fl=null;
    function startMode(m) {
      mode=m; step=0;
      document.getElementById('dogImg').style.display = m==='dog' ? 'block' : 'none';
      document.getElementById('personImg').style.display = m==='person' ? 'block' : 'none';
      document.getElementById('eA').classList.remove('on');
      document.getElementById('eB').classList.remove('on');
      hideMsg();
      var im = document.getElementById(m==='dog' ? 'dogImg' : 'personImg');
      var fn = function(){ posEyes(m); };
      if (im.complete) { fn(); } else { im.addEventListener('load', fn, {once:true}); }
      if (window._r) { window.removeEventListener('resize', window._r); }
      window._r = function(){ posEyes(m); };
      window.addEventListener('resize', window._r);
      document.getElementById('sel').classList.add('hidden');
      document.getElementById('main').classList.add('visible');
    }
    function goBack() {
      clearT(); setEyes(false); hideMsg(); step=0;
      if (window._r) { window.removeEventListener('resize', window._r); }
      document.getElementById('main').classList.remove('visible');
      document.getElementById('sel').classList.remove('hidden');
    }
    function setEyes(on) {
      document.getElementById('eA').classList.toggle('on', on);
      document.getElementById('eB').classList.toggle('on', on);
    }
    function showMsg(t) { var m=document.getElementById('msg'); m.textContent=t; m.classList.add('visible'); }
    function hideMsg() { var m=document.getElementById('msg'); m.classList.remove('visible'); m.textContent=''; }
    function clearT() {
      if (bl) { clearInterval(bl); bl=null; }
      if (fl) { clearTimeout(fl); fl=null; }
    }
    function s1() { clearT(); setEyes(true); hideMsg(); fl=setTimeout(function(){setEyes(false);}, 420); }
    function s2() { clearT(); hideMsg(); var on=false; bl=setInterval(function(){on=!on;setEyes(on);}, 260); }
    function s3() { clearT(); setEyes(false); showMsg(fm[mode]); }
    document.getElementById('btn').addEventListener('click', function() {
      step = step>=3 ? 1 : step+1;
      if (step===1) s1(); else if (step===2) s2(); else s3();
    });
  </script>
