<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>コウです！</title>
  <style>
    :root {
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0; padding: 0;
    }

    html, body {
      height: 100%;
      background: #04070d;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100svh;
    }

    /* ========================
       写真エリア（全画面主役）
    ======================== */
    .photo {
      position: relative;
      flex: 1;
      overflow: hidden;
      min-height: 0;
    }

    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 10%;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    /* 下端グラデーション */
    .photo::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        transparent 52%,
        rgba(4,7,13,0.12) 70%,
        rgba(4,7,13,0.52) 86%,
        #04070d 100%
      );
      pointer-events: none;
    }

    /* ========================
       目の光エフェクト
       ★ Pythonで実測した座標 ★

       left / top  = 光の円の「左上角」の位置（画像に対する%）
       width       = 光の円の直径（画像幅に対する%）

       眼球中心:
         左目  left=25.20%  top=36.52%（中心）
         右目  left=74.41%  top=36.91%（中心）
       widthはそれぞれ 15.4% / 17.4%
       left/top は 中心 - radius で算出済み
    ======================== */
    .eye {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      mix-blend-mode: screen;
      aspect-ratio: 1 / 1;

      opacity: 0;
      transform: scale(0.5);
      transition: opacity 140ms ease, transform 140ms ease;

      background: radial-gradient(circle,
        rgba(240,252,255,1.00)  0%,
        rgba(220,248,255,1.00)  8%,
        rgba(140,224,255,0.97) 26%,
        rgba(72, 178,255,0.82) 50%,
        rgba(50, 150,255,0.30) 72%,
        rgba(30, 120,255,0.00) 100%
      );
      filter:
        blur(0.4px)
        drop-shadow(0 0  5px rgba(180,235,255,0.95))
        drop-shadow(0 0 16px rgba(110,205,255,0.88))
        drop-shadow(0 0 38px rgba(70, 175,255,0.60));
    }

    /* 眼球ハイライト（白く光る中心） */
    .eye::before {
      content: "";
      position: absolute;
      inset: 18%;
      border-radius: 50%;
      background: radial-gradient(circle,
        rgba(255,255,255,1.00)  0%,
        rgba(255,255,255,0.65) 40%,
        rgba(255,255,255,0.00) 100%
      );
    }

    /* ---- 左目（実測値） ---- */
    .eye--left {
      left:  17.48%;   /* 眼球中心25.20% - 半径7.72% */
      top:   28.81%;   /* 眼球中心36.52% - 半径7.71% */
      width: 15.4%;
    }

    /* ---- 右目（実測値） ---- */
    .eye--right {
      left:  65.72%;   /* 眼球中心74.41% - 半径8.69% */
      top:   28.22%;   /* 眼球中心36.91% - 半径8.69% */
      width: 17.4%;
    }

    /* ONアニメーション */
    .eye.on {
      opacity: 1;
      transform: scale(1.08);
      animation: eyePulse 0.85s ease-in-out infinite alternate;
    }

    @keyframes eyePulse {
      from {
        filter:
          blur(0.3px)
          drop-shadow(0 0  5px rgba(180,235,255,0.90))
          drop-shadow(0 0 15px rgba(110,205,255,0.82))
          drop-shadow(0 0 36px rgba(70, 175,255,0.55));
        transform: scale(1.04);
      }
      to {
        filter:
          blur(1.0px)
          drop-shadow(0 0 13px rgba(215,250,255,1.00))
          drop-shadow(0 0 32px rgba(150,220,255,0.98))
          drop-shadow(0 0 76px rgba(70, 175,255,0.72));
        transform: scale(1.15);
      }
    }

    /* ========================
       ボトムUI
    ======================== */
    .bottom {
      flex-shrink: 0;
      padding: 12px 20px calc(18px + var(--safe-bottom));
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 11px;
    }

    /* メッセージ */
    .msg {
      font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif;
      font-size: clamp(1.15rem, 5.8vw, 1.6rem);
      font-weight: 800;
      letter-spacing: 0.10em;
      color: #eaf7ff;
      text-shadow:
        0 0 10px rgba(130,215,255,0.95),
        0 0 28px rgba(80, 185,255,0.68);
      min-height: 1.8em;
      text-align: center;
      opacity: 0;
      transition: opacity 220ms ease;
    }

    .msg.visible {
      opacity: 1;
    }

    /* ボタン（1つだけ） */
    .btn {
      display: block;
      width: 100%;
      max-width: 340px;
      border: none;
      border-radius: 20px;
      padding: 0 24px;
      height: 58px;
      font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif;
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: 0.07em;
      cursor: pointer;
      color: #03101f;
      background: linear-gradient(170deg, #dcf4ff 0%, #8ad2ff 42%, #4ab4ff 100%);
      box-shadow:
        0  8px 26px rgba(80,195,255,0.38),
        inset 0 1px 0 rgba(255,255,255,0.60);
      transition: transform 120ms ease, box-shadow 120ms ease;
    }

    .btn:hover  {
      transform: translateY(-2px);
      box-shadow: 0 14px 34px rgba(80,195,255,0.48), inset 0 1px 0 rgba(255,255,255,0.60);
    }
    .btn:active {
      transform: translateY(1px) scale(0.983);
      box-shadow: 0  4px 12px rgba(80,195,255,0.26), inset 0 1px 0 rgba(255,255,255,0.60);
    }
  </style>
</head>

    />
    <div class="eye eye--left"  id="eyeL"></div>
    <div class="eye eye--right" id="eyeR"></div>
  </div>

  <!-- UI -->
  <div class="bottom">
    <div class="msg" id="msg"></div>
    <button class="btn" id="btn">ここを押す</button>
  </div>

  <script>
    const eyeL = document.getElementById('eyeL');
    const eyeR = document.getElementById('eyeR');
    const btn  = document.getElementById('btn');
    const msg  = document.getElementById('msg');

    let step       = 0;
    let blinkTimer = null;
    let flashTimer = null;

    function eyes(on) {
      eyeL.classList.toggle('on', on);
      eyeR.classList.toggle('on', on);
    }

    function showMsg(text) {
      msg.textContent = text;
      msg.classList.add('visible');
    }

    function hideMsg() {
      msg.classList.remove('visible');
      msg.textContent = '';
    }

    function clearTimers() {
      if (blinkTimer) { clearInterval(blinkTimer); blinkTimer = null; }
      if (flashTimer) { clearTimeout(flashTimer);  flashTimer = null; }
    }

    /* ステップ1: ピカッ！ */
    function step1() {
      clearTimers();
      eyes(true);
      hideMsg();
      flashTimer = setTimeout(() => eyes(false), 420);
    }

    /* ステップ2: ピカピカ点滅 */
    function step2() {
      clearTimers();
      hideMsg();
      let on = false;
      blinkTimer = setInterval(() => { on = !on; eyes(on); }, 260);
    }

    /* ステップ3: OFF + コウです！ */
    function step3() {
      clearTimers();
      eyes(false);
      showMsg('コウです！');
    }

    btn.addEventListener('click', () => {
      step = step >= 3 ? 1 : step + 1;
      if      (step === 1) step1();
      else if (step === 2) step2();
      else                 step3();
    });
  </script>
